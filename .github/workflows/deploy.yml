name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare deployment folder
        run: |
          mkdir -p _site
          # Copy your landing page and ALL tool sheets safely into the deployment folder
          cp index.html _site/
          cp aethel-character-sheet.html _site/
          cp aethel-character-sheet-mobile.html _site/
          cp pasqually-spell-slinger.html _site/
          
          # Copy accompanying asset files if they exist
          cp *.json _site/ 2>/dev/null || true
          cp *.css  _site/ 2>/dev/null || true
          cp *.js   _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
